version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg_password
      POSTGRES_DB: test_case_generator
    ports:
      - '5433:5432'
    volumes:
      - tcg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tcg -d test_case_generator']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tcg_pgdata:
